version = "3.11.1"
runner.dialect = scala3
maxColumn = 100
# cache-breaker: 1

# compat-fixtures' scala-2.13 source set intentionally exercises Scala-2-only syntax (e.g.
# procedure syntax) that the scala3 dialect above rejects outright.
fileOverride {
  "glob:**/scala-2.13/**" {
    runner.dialect = scala213
  }
}