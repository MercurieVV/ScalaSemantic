version = "3.11.5"
runner.dialect = scala3
maxColumn = 100
# cache-breaker: 1

# compat-fixtures' scala-2.13 source set is compiled with the 2.13 compiler (see build.mill
# CompatModule) — parse it under the matching dialect rather than the repo-wide scala3 default.
fileOverride {
  "glob:**/scala-2.13/**" {
    runner.dialect = scala213
  }
}