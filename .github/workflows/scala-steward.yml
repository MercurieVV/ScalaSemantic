name: Scala Steward

on:
  workflow_dispatch:                # manual: Actions tab -> Run workflow
  schedule:
    - cron: "0 6 * * 1"             # continuous: every Monday 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
