# Runs stryker4s mutation testing via scripts/run-stryker.sh (Mill-side). The unreleased Mill
# plugin snapshot lives vendored at vendor/stryker4s-mill/ (jar + ivy.xml, ~1.9M — no sbt/network
# build step in CI, see that script's header for how to refresh it) and is patched into an isolated
# build.mill copy via scripts/generate-stryker-overlay.py — never the committed one.
#
# `analysis` is the only module currently proven to run cleanly end-to-end (744 mutants, full
# report, no InitialTestRunFailedException — that exception, which blocked every earlier attempt,
# was fixed upstream by stryker-mutator/stryker4s#2068 "handle messages larger than socket buffer").
# `core` is NOT wired as reliable: its only test class, SemanticIndexSuite, dogfoods the whole
# project's own live SemanticDB — the original sbt-era stryker4s.conf deliberately excluded it for
# exactly this self-reference reason, and core has no other test suite, so it structurally cannot
# be mutation-tested.
# `mcp` had several gaps, all fixed:
# - Two compile-time gaps: BuildInfo's generated source wasn't inherited by mcpStryker, and the
#   MethodExpression mutator produces a `Files.forall` variant that doesn't compile against
#   `java.nio.file.Files` (excluded via strykerExcludedMutations).
# - `McpTools.all`'s single ~800-line tool-construction method tripped the JVM's 64KB-per-method
#   bytecode cap under certain mutants ("Method too large"); wrapping each tool in a by-name
#   `toolDef(t: => Tool)` call moved each into its own synthetic method, but Scala/dotty still
#   compiles those onto the SAME enclosing class file, so the *class*'s constant pool then tripped
#   the JVM's per-class size cap instead ("Class too large"). Fixed by physically splitting the 19
#   tools across 4 sibling top-level objects (`McpToolsGroupA-D`), each its own class file/budget.
# - The real blocker, `InitialTestRunFailedException` with zero diagnostic detail in any stryker4s
#   log: the Mill plugin's `MillConfigSource` hardcodes `baseDir = moduleDir` (e.g. `mcp/`), so the
#   forked test-runner subprocess's cwd is the module dir, not the repo root. `McpSuite` dogfoods via
#   `SemanticIndex.fromProject(".")`, which needs cwd = repo root (see CLAUDE.md) to see every
#   module's SemanticDB output; under the wrong cwd it silently resolves to an empty index, every
#   SemanticDB-backed assertion fails, and the whole suite reports `Status.Failure` with zero
#   individual test failures recorded — stryker4s surfaces only its generic
#   `InitialTestRunFailedException`, with nothing in its own logs to explain why. Root-caused by
#   patching diagnostic logging directly into a locally rebuilt stryker4s (its own
#   `--log-test-runner-stdout` CLI flag turned out to be misdocumented too — it's a bare flag, not
#   `--debug.log-test-runner-stdout` — and even correctly enabled, the underlying event handler for
#   the *initial* test run discards individual failed-test detail entirely, unlike the per-mutant
#   handler). Fixed in scripts/run-stryker.sh: `run_module` now passes `--base-dir "$run_dir"`
#   (CLI config outranks the Mill plugin's own baseDir source), and `module_mutate_patterns` globs
#   are now repo-root-relative to match.
# - A second, unrelated failure surfaced once the initial run actually executed real tests:
#   `smart_code_duplications` (a whole-project scan) exceeded munit's default 30s per-test timeout
#   when 5 concurrent test-runner JVMs compete for CPU during mutation testing. Fixed by bumping
#   `McpSuite`'s `munitTimeout` to 120s.
# - `McpSuite` no longer runs the two presentation-compiler-backed tests (moved to `McpPcSuite`,
#   which `--test-filter McpSuite` never touches), keeping per-mutant test execution cheap.
# It's still heavy: 700+ mutants recompiled in-process against McpTools.scala is legitimately slow
# (~20-30 min) and memory-hungry — this predates the Mill migration entirely (see
# docs/research/stryker4s-alert-strategy.md #4 "Implementation note from #133": the old sbt CI
# already needed `SBT_OPTS=-Xmx4G` for the same reason). The `Run Stryker4s modules` step below sets
# the Mill-side equivalent (`JAVA_TOOL_OPTIONS: -Xmx4g`). `core` still needs a structural fix (or
# acceptance that it's out of scope) before `--module all`/`core` can be trusted in CI.
#
# On success, this workflow commits reports/mutation/**/report.json (the stable per-module report
# mutation-summary.sh writes) back to the branch being tested, so mutation score/survivor history
# is diffable in git log — NOT the timestamped stryker4s-report/ HTML (still upload-artifact'd, not
# committed: large and not text-diffable). paths-ignore on the pull_request trigger below stops a
# report-only commit from re-triggering this workflow (or ci.yml, via its own paths-ignore) in a loop.
name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Space-separated modules to mutate: analysis, core, mcp, or all (only analysis is currently reliable — see workflow header)'
        required: false
        default: 'analysis'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'reports/mutation/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  MUTATION_HIGH_THRESHOLD: '80'
  MUTATION_LOW_THRESHOLD: '60'
  # Initial rollout grace period from docs/research/stryker4s-alert-strategy.md:
  # Stryker exits non-zero for tooling errors, but not for advisory score drops yet.
  MUTATION_BREAK_THRESHOLD: '0'
  MUTATION_ALERTS_FAIL: '0'

jobs:
  stryker:
    name: Stryker4s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache coursier + Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill/download
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            mill-${{ runner.os }}-

      - name: Decide mutation scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODULES: ${{ github.event.inputs.modules }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL_RUN: ${{ contains(github.event.pull_request.labels.*.name, 'ci:run-mutation') }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          modules=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            modules="${DISPATCH_MODULES:-analysis}"
            [[ "$modules" == "all" ]] && modules="core analysis mcp"
          elif [[ "$EVENT_NAME" == "schedule" || "$LABEL_RUN" == "true" ]]; then
            modules="analysis"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            files="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"
            if grep -qE '^(stryker4s\.conf|scripts/(run-stryker|mutation-summary|generate-stryker-overlay)\.(sh|py)|vendor/stryker4s-mill/.*|\.github/workflows/mutation\.yml)$' <<<"$files"; then
              modules="analysis"
            else
              grep -q '^analysis/src/main/scala/' <<<"$files" && modules="$modules analysis"
            fi
          fi

          modules="$(xargs <<<"$modules")"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          if [[ -z "$modules" ]]; then
            echo "No mutation-relevant module changes detected; skipping heavy Stryker4s run."
          else
            echo "Mutation modules: $modules"
          fi

      - name: Run Stryker4s modules
        if: steps.scope.outputs.modules != ''
        env:
          MODULES: ${{ steps.scope.outputs.modules }}
          # mcp has always needed extra heap under mutation testing (800+ mutants recompiled
          # in-process) — the old sbt-era CI set `SBT_OPTS=-Xmx4G` for exactly this reason (see
          # docs/research/stryker4s-alert-strategy.md #4 "Implementation note from #133"). Mill
          # runs the equivalent recompile loop inside its own daemon JVM, so bump its heap the
          # same way via JAVA_TOOL_OPTIONS (picked up by any JVM, including Mill's launcher).
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: |
          set -euo pipefail
          mkdir -p reports/mutation
          for module in $MODULES; do
            mkdir -p "reports/mutation/$module"
            MUTATION_MODULE="$module" \
            MUTATION_REPORT_DEST="reports/mutation/$module/report.json" \
              scripts/run-stryker.sh --local --module "$module" 2>&1 \
              | tee "reports/mutation/$module/summary.txt"
          done

      - name: Build mutation PR comment
        if: steps.scope.outputs.modules != '' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          {
            echo "### Stryker4s mutation summary"
            echo
            echo "Modules: ${{ steps.scope.outputs.modules }}"
            echo
            for summary in reports/mutation/*/summary.txt; do
              module="$(basename "$(dirname "$summary")")"
              echo "#### $module"
              echo '```text'
              grep -E 'mutation score:|mutants by status:|  (Killed|Survived|NoCoverage|Timeout|CompileError|Ignored):|surviving mutants by type:|  [A-Za-z]+:|alert:' "$summary" || true
              echo '```'
              echo
            done
            echo "HTML and JSON reports are attached to the workflow run as the stryker4s-report artifact."
          } > reports/mutation/comment.md

      - name: Commit mutation report
        if: steps.scope.outputs.modules != ''
        run: |
          set -euo pipefail
          git add reports/mutation/*/report.json reports/mutation/*/summary.txt
          if git diff --cached --quiet; then
            echo "no report changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(mutation): update stryker4s report [${{ steps.scope.outputs.modules }}]"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Upload mutation reports
        if: steps.scope.outputs.modules != ''
        uses: actions/upload-artifact@v4
        with:
          name: stryker4s-report
          path: |
            reports/mutation/**
            target/stryker4s-report/**
          if-no-files-found: error

      - name: Comment mutation summary on PR
        if: steps.scope.outputs.modules != '' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file reports/mutation/comment.md
