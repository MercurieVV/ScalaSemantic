# Runs stryker4s mutation testing via scripts/run-stryker.sh (Mill-side). The unreleased Mill
# plugin snapshot lives vendored at vendor/stryker4s-mill/ (jar + ivy.xml, ~1.9M — no sbt/network
# build step in CI, see that script's header for how to refresh it) and is patched into an isolated
# build.mill copy via scripts/generate-stryker-overlay.py — never the committed one.
#
# `analysis` is the only module currently proven to run cleanly end-to-end (744 mutants, full
# report, no InitialTestRunFailedException — that exception, which blocked every earlier attempt,
# was fixed upstream by stryker-mutator/stryker4s#2068 "handle messages larger than socket buffer").
# `core` and `mcp` are NOT wired as reliable:
#   - `core`'s only test class, SemanticIndexSuite, dogfoods the whole project's own live SemanticDB
#     — the original sbt-era stryker4s.conf deliberately excluded it for exactly this self-reference
#     reason, and core has no other test suite, so it structurally cannot be mutation-tested.
#   - `mcp` had two real compile-time gaps (now fixed in the overlay: BuildInfo's generated source
#     wasn't inherited by mcpStryker, and the MethodExpression mutator produces a `Files.forall`
#     variant that doesn't compile against `java.nio.file.Files`) but still hangs/crashes running
#     the actual mutants against McpSuite — a separate, unresolved performance issue.
# Both need further follow-up before `--module all`/`core`/`mcp` can be trusted in CI.
#
# On success, this workflow commits reports/mutation/**/report.json (the stable per-module report
# mutation-summary.sh writes) back to the branch being tested, so mutation score/survivor history
# is diffable in git log — NOT the timestamped stryker4s-report/ HTML (still upload-artifact'd, not
# committed: large and not text-diffable). paths-ignore on the pull_request trigger below stops a
# report-only commit from re-triggering this workflow (or ci.yml, via its own paths-ignore) in a loop.
name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Space-separated modules to mutate: analysis, core, mcp, or all (only analysis is currently reliable — see workflow header)'
        required: false
        default: 'analysis'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'reports/mutation/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  MUTATION_HIGH_THRESHOLD: '80'
  MUTATION_LOW_THRESHOLD: '60'
  # Initial rollout grace period from docs/research/stryker4s-alert-strategy.md:
  # Stryker exits non-zero for tooling errors, but not for advisory score drops yet.
  MUTATION_BREAK_THRESHOLD: '0'
  MUTATION_ALERTS_FAIL: '0'

jobs:
  stryker:
    name: Stryker4s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache coursier + Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill/download
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            mill-${{ runner.os }}-

      - name: Decide mutation scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODULES: ${{ github.event.inputs.modules }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL_RUN: ${{ contains(github.event.pull_request.labels.*.name, 'ci:run-mutation') }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          modules=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            modules="${DISPATCH_MODULES:-analysis}"
            [[ "$modules" == "all" ]] && modules="core analysis mcp"
          elif [[ "$EVENT_NAME" == "schedule" || "$LABEL_RUN" == "true" ]]; then
            modules="analysis"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            files="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"
            if grep -qE '^(stryker4s\.conf|scripts/(run-stryker|mutation-summary|generate-stryker-overlay)\.(sh|py)|vendor/stryker4s-mill/.*|\.github/workflows/mutation\.yml)$' <<<"$files"; then
              modules="analysis"
            else
              grep -q '^analysis/src/main/scala/' <<<"$files" && modules="$modules analysis"
            fi
          fi

          modules="$(xargs <<<"$modules")"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          if [[ -z "$modules" ]]; then
            echo "No mutation-relevant module changes detected; skipping heavy Stryker4s run."
          else
            echo "Mutation modules: $modules"
          fi

      - name: Run Stryker4s modules
        if: steps.scope.outputs.modules != ''
        env:
          MODULES: ${{ steps.scope.outputs.modules }}
        run: |
          set -euo pipefail
          mkdir -p reports/mutation
          for module in $MODULES; do
            mkdir -p "reports/mutation/$module"
            MUTATION_MODULE="$module" \
            MUTATION_REPORT_DEST="reports/mutation/$module/report.json" \
              scripts/run-stryker.sh --local --module "$module" 2>&1 \
              | tee "reports/mutation/$module/summary.txt"
          done

      - name: Build mutation PR comment
        if: steps.scope.outputs.modules != '' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          {
            echo "### Stryker4s mutation summary"
            echo
            echo "Modules: ${{ steps.scope.outputs.modules }}"
            echo
            for summary in reports/mutation/*/summary.txt; do
              module="$(basename "$(dirname "$summary")")"
              echo "#### $module"
              echo '```text'
              grep -E 'mutation score:|mutants by status:|  (Killed|Survived|NoCoverage|Timeout|CompileError|Ignored):|surviving mutants by type:|  [A-Za-z]+:|alert:' "$summary" || true
              echo '```'
              echo
            done
            echo "HTML and JSON reports are attached to the workflow run as the stryker4s-report artifact."
          } > reports/mutation/comment.md

      - name: Commit mutation report
        if: steps.scope.outputs.modules != ''
        run: |
          set -euo pipefail
          git add reports/mutation/*/report.json reports/mutation/*/summary.txt
          if git diff --cached --quiet; then
            echo "no report changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(mutation): update stryker4s report [${{ steps.scope.outputs.modules }}]"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Upload mutation reports
        if: steps.scope.outputs.modules != ''
        uses: actions/upload-artifact@v4
        with:
          name: stryker4s-report
          path: |
            reports/mutation/**
            */target/stryker4s-report/**
          if-no-files-found: error

      - name: Comment mutation summary on PR
        if: steps.scope.outputs.modules != '' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file reports/mutation/comment.md
