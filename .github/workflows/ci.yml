name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch: # manual dry-run: builds, then publishes a -SNAPSHOT (exercises creds + signing)

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so sbt-dynver derives the version from tags
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt scalafmtCheckAll
      - name: Regenerate cross-version compat golden SemanticDB
        # Recompiles compat-fixtures under every Scala in `compatScalaVersions` so CompatSuite runs
        # against THIS runner's freshly emitted *.semanticdb. (We don't byte-compare against the
        # committed golden: SemanticDB output isn't guaranteed identical across environments/compiler
        # patches. The committed copies exist for local `sbt test` without a cross-compile.)
        run: sbt compatGoldenAll
      - name: Compile sbt plugin for sbt 1 and sbt 2
        run: sbt +sbtPlugin/compile
      - name: Test
        run: sbt test

  docs-site:
    name: Publish docs site (GitHub Pages)
    needs: [build]
    # Render the mdoc docs, build the Docusaurus site, deploy to GitHub Pages. Master only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # OIDC token the deploy-pages action requires
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate release notes page from tags
        run: scripts/gen-release-notes.sh # writes docs/RELEASE_NOTES.md (gitignored, build-time only)
      - name: Render docs with mdoc
        run: sbt docs/run # writes executed Markdown into website/docs
      - name: Build Docusaurus site
        working-directory: website
        run: |
          npm install
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Publish to Sonatype Central
    needs: [build]
    # On a vX.Y.Z tag push (release), or a manual run (workflow_dispatch) which publishes a
    # -SNAPSHOT to dry-run credentials + signing without cutting a release.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1

      # Import the signing key into gpg up front (the proven aidclimbing flow). Two variants:
      # one for a passphrase-less key, one that imports then strips the passphrase.
      - name: Import signing key
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE == ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: echo "$PGP_SECRET" | base64 -d -i - | gpg --import

      - name: Import signing key and strip passphrase
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE != ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          echo "$PGP_SECRET" | base64 -d -i - > /tmp/signing-key.gpg
          echo "$PGP_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 --import /tmp/signing-key.gpg
          (echo "$PGP_PASSPHRASE"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase $(gpg --list-secret-keys --with-colons 2> /dev/null | grep '^sec:' | cut --delimiter ':' --fields 5 | tail -n 1)

      # ci-release still needs PGP_SECRET/PGP_PASSPHRASE in ITS env or it logs
      # "No access to secret variables, doing nothing" and skips publishing.
      - name: Publish (sign + upload via ci-release)
        run: sbt ci-release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_CREDENTIAL_HOST: central.sonatype.com
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

  release:
    name: GitHub Release (fat jar)
    needs: [build]
    # Only on a vX.Y.Z tag push: build the standalone `java -jar` fat jar and attach it to a
    # GitHub Release so the auto-download launcher scripts can fetch the latest asset.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so sbt-dynver stamps the jar with the tag version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build fat jar
        run: sbt "mcp/assembly"
      - name: Collect asset
        run: |
          jar=$(find . -name scalasemantic-mcp.jar | head -1)
          echo "Found: $jar"
          mkdir -p release-assets
          cp "$jar" release-assets/scalasemantic-mcp.jar
      - name: Generate release notes (user-facing changes only)
        run: |
          # Body = filtered Conventional-Commit changelog for the range previous-tag..this-tag.
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          echo "Range: $range"
          scripts/changelog.sh "$range" | tee release-notes.md
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/scalasemantic-mcp.jar
          body_path: release-notes.md

  update-doc-versions:
    name: Update docs with published version
    needs: [publish, release]
    # After a real tag release publishes successfully, refresh the dependency snippets to the
    # just-published version. master is protected, so open a PR (auto-merged) instead of pushing to
    # it directly. Normal docs rendering stays offline/deterministic.
    # Cosmetic + post-release: never let it fail the release run. (It also no-ops unless the repo
    # setting "Allow GitHub Actions to create and approve pull requests" is enabled.)
    continue-on-error: true
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Rewrite doc version snippets to the published version
        run: scripts/update-doc-versions.sh "${GITHUB_REF_NAME}"
      - name: Open PR updating the doc version snippets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md docs/INTEGRATION.md; then
            echo "Docs already mention ${GITHUB_REF_NAME}."
            exit 0
          fi
          branch="bot/docs-version-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add README.md docs/INTEGRATION.md
          git commit -m "docs: update version snippets for ${GITHUB_REF_NAME}"
          git push -u origin "$branch" --force
          gh pr create --base master --head "$branch" \
            --title "docs: update version snippets for ${GITHUB_REF_NAME}" \
            --body "Automated: align README/INTEGRATION dependency snippets with the published ${GITHUB_REF_NAME}." \
            || gh pr edit "$branch" --title "docs: update version snippets for ${GITHUB_REF_NAME}"
          gh pr merge "$branch" --auto --squash --delete-branch
