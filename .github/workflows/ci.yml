name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'mdoc-docs/**'
      - '*.md'
      - '.gitignore'
      - '.agents/**'
  pull_request:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'mdoc-docs/**'
      - '*.md'
      - '.gitignore'
      - '.agents/**'
  workflow_dispatch: # manual dry-run: builds, then publishes a -SNAPSHOT (exercises creds + signing)

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `publishVersion`/`latestReleaseVersion` derive from tags
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # setup-java's built-in `cache:` only knows maven/gradle/sbt, not Mill — cache coursier +
          # Mill's own out/ dep-resolution artifacts explicitly instead.
      - name: Cache coursier + Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill/download
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            mill-${{ runner.os }}-
      - name: Check formatting
        run: ./mill mill.scalalib.scalafmt/checkFormatAll __.sources
      - name: Check scalafix
        # Uses scalafix-interfaces (a stable, Maven-Central-published embedding API) directly from
        # build.mill, not the mill-scalafix plugin — that plugin has no Mill 1.x build.
        # IMPORTANT: use the `__.scalafixCheck` wildcard selector, NOT a space-separated list of
        # explicit targets (`core.scalafixCheck pc.scalafixCheck ...`) — confirmed that Mill 1.1.7
        # silently executes only the FIRST explicitly-named target in a multi-target invocation and
        # still reports overall SUCCESS for the rest (verified locally: compile/test/scalafixCheck
        # all reproduce this with explicit multi-target lists; `__`-selector forms do not).
        run: ./mill __.scalafixCheck
      - name: Regenerate cross-version compat golden SemanticDB
        # Recompiles compat-fixtures under every Scala in `compatScalaVersions` so CompatSuite runs
        # against THIS runner's freshly emitted *.semanticdb. (We don't byte-compare against the
        # committed golden: SemanticDB output isn't guaranteed identical across environments/compiler
        # patches. The committed copies exist for local `./mill test` without a cross-compile.)
        run: ./mill compatGoldenAll
      - name: Compile all test sources
        # Runs separately, BEFORE the Test step: dogfood suites (e.g. AnalyzerStructureSuite) call
        # SemanticIndex.fromProject(".") and walk the ENTIRE out/ tree for *.semanticdb from every
        # module, main AND test sources. Mill runs independent modules' compile/test-compile/test
        # tasks concurrently, so without this separate step a module's test can start scanning that
        # tree while ANOTHER module's test-compile is still concurrently writing its own *.semanticdb
        # files, seeing a transiently incomplete/partial graph (reproduced on CI: AnalyzerStructureSuite
        # saw `core layer=1` instead of `0` — a real flake from partial state, not a code bug).
        # Splitting compile from test removes the write/read race; only test EXECUTION stays parallel.
        run: ./mill __.test.compile
      - name: Test
        run: ./mill __.test.testForked

  verify:
    name: Stainless verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Cache the standalone Stainless distribution (bundled z3/cvc5) so we don't re-download the
      # ~80MB asset every run. Keyed on the version the script defaults to.
      - name: Cache Stainless tool
        uses: actions/cache@v4
        with:
          path: ~/.cache/scalasemantic/stainless
          key: stainless-0.9.9.3
      - name: Verify contracts
        # shells out to scripts/stainless-verify.sh; fails iff a VC is INVALID (the
        # nonlinear rangeSpan VC that the bundled solver can only mark `unknown` is tolerated).
        # Generous per-VC timeout here (prePush uses a tighter default for speed).
        run: ./mill analysis.stainlessVerify
        env:
          STAINLESS_TIMEOUT: '30'

  docs-site:
    name: Publish docs site (GitHub Pages)
    needs: [build]
    # Render the mdoc docs, build the Docusaurus site, deploy to GitHub Pages. Master only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # OIDC token the deploy-pages action requires
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate release notes page from tags
        run: scripts/gen-release-notes.sh # writes docs/RELEASE_NOTES.md (gitignored, build-time only)
      - name: Render docs with mdoc
        run: ./mill docs.run # writes executed Markdown into website/docs
      - name: Build Docusaurus site
        working-directory: website
        run: |
          npm install
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Publish to Sonatype Central
    needs: [build, verify]
    # On a vX.Y.Z tag push (release), or a manual run (workflow_dispatch) which publishes a
    # -SNAPSHOT to dry-run credentials + signing without cutting a release.
    #
    # STILL ON SBT: no working Mill 1.x publish path exists yet. io.chris-kipp::mill-ci-release's
    # newest published build targets mill0.12 (see docs/MILL_MIGRATION.md §2) — same TASTy-vintage
    # problem confirmed for mill-scalafix against Mill 1.1.7 (unpickling failure loading the module
    # trait). Revisit once a mill1.x-tagged release exists; until then this job (and build.sbt/
    # project/) stay in place purely to keep publishing working.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1

      # Import the signing key into gpg up front (the proven aidclimbing flow). Two variants:
      # one for a passphrase-less key, one that imports then strips the passphrase.
      - name: Import signing key
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE == ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: echo "$PGP_SECRET" | base64 -d -i - | gpg --import

      - name: Import signing key and strip passphrase
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE != ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          echo "$PGP_SECRET" | base64 -d -i - > /tmp/signing-key.gpg
          echo "$PGP_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 --import /tmp/signing-key.gpg
          (echo "$PGP_PASSPHRASE"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase $(gpg --list-secret-keys --with-colons 2> /dev/null | grep '^sec:' | cut --delimiter ':' --fields 5 | tail -n 1)

      # ci-release still needs PGP_SECRET/PGP_PASSPHRASE in ITS env or it logs
      # "No access to secret variables, doing nothing" and skips publishing.
      - name: Publish (sign + upload via ci-release)
        run: sbt --batch ci-release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_CREDENTIAL_HOST: central.sonatype.com
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

  release:
    name: GitHub Release (fat jar)
    needs: [build, verify]
    # Only on a vX.Y.Z tag push: build the standalone `java -jar` fat jar and attach it to a
    # GitHub Release so the auto-download launcher scripts can fetch the latest asset.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `publishVersion` stamps the jar with the tag version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build fat jar
        run: ./mill mcp.assembly
      - name: Collect asset
        # Mill's assembly output is always named out.jar (no sbt-assembly-style assemblyJarName
        # setting) — rename on copy so the release asset keeps its stable download filename.
        run: |
          mkdir -p release-assets
          cp out/mcp/assembly.dest/out.jar release-assets/scalasemantic-mcp.jar
      - name: Generate release notes (user-facing changes only)
        run: |
          # Body = filtered Conventional-Commit changelog for the range previous-tag..this-tag.
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          echo "Range: $range"
          scripts/changelog.sh "$range" | tee release-notes.md
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/scalasemantic-mcp.jar
          body_path: release-notes.md
