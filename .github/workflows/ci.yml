name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'mdoc-docs/**'
      - '*.md'
      - '.gitignore'
      - '.agents/**'
      - 'reports/mutation/**'
  pull_request:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'mdoc-docs/**'
      - '*.md'
      - '.gitignore'
      - '.agents/**'
      - 'reports/mutation/**'
  workflow_dispatch: # manual dry-run: builds, then publishes a -SNAPSHOT (exercises creds + signing)

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `publishVersion`/`latestReleaseVersion` derive from tags
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # setup-java's built-in `cache:` only knows maven/gradle/sbt, not Mill — cache coursier +
          # Mill's own out/ dep-resolution artifacts explicitly instead.
      - name: Install scala-cli
        uses: VirtusLab/scala-cli-setup@v1.3.0
      - name: Cache coursier + Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill/download
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            mill-${{ runner.os }}-
      - name: Check formatting
        # `checkFormatFirstParty` (build.mill) — scoped to the modules we own, NOT `__.sources`:
        # `compat-fixtures` and `corpus` intentionally hold vendored/cross-version fixture sources
        # that aren't ours to reformat and aren't valid under the repo-wide `scala3` dialect anyway.
        run: ./mill checkFormatFirstParty
      - name: Check build.mill formatting
        # Standalone script, NOT a Mill task: build.mill lives in its own evaluator context
        # (meta-level 1), and a Mill Task.Command that shells out to `./mill --meta-level N ...`
        # deadlocks against its own daemon (Mill serializes all commands through one daemon per
        # project) — confirmed by a 15+ minute hang. Must run as a plain shell step like this one.
        run: scripts/check-build-mill-fmt.sh
      - name: Check scalafix
        # Uses com.goyeau::mill-scalafix (see `ScalafixConfigured` in build.mill). Modules are
        # discovered reflectively via `checkScalafixFirstParty` (build.mill) — same pattern as
        # `checkFormatFirstParty` above — so new modules are picked up automatically instead of
        # relying on a `__.scalafixCheck` wildcard selector (which no longer resolves now that
        # module discovery happens inside a single Task.Command, not per-module targets).
        run: ./mill checkScalafixFirstParty
      - name: Regenerate cross-version compat golden SemanticDB
        # Recompiles compat-fixtures under every Scala in `compatScalaVersions` so CompatSuite runs
        # against THIS runner's freshly emitted *.semanticdb. (We don't byte-compare against the
        # committed golden: SemanticDB output isn't guaranteed identical across environments/compiler
        # patches. The committed copies exist for local `./mill test` without a cross-compile.)
        run: ./mill compatGoldenAll
      - name: Compile all test sources
        # Runs separately, BEFORE the Test step, so every module's *.semanticdb is on disk before any
        # dogfood suite (e.g. AnalyzerStructureSuite) calls SemanticIndex.fromProject(".") to walk the
        # whole out/ tree. (An initial hypothesis blamed a compile/test-execution race for CI-only
        # flakiness here; that was wrong — the real cause was a filesystem-order bug in
        # SemanticIndex.findSemanticdb, fixed by sorting the file walk. See that file's comment.)
        run: ./mill __.test.compile
      - name: Test
        run: ./mill __.test.testForked
      - name: Run E2E Smoke Test
        run: ./mill smokeTest
      - name: Verify Regression Files Consistency (Unit & E2E)
        run: scala-cli --server=false scripts/generate-regressions.scala -- --check --categories unit e2e
      - name: Check for Regressions against Base (Unit & E2E)
        if: github.event_name == 'pull_request'
        run: scala-cli --server=false scripts/generate-regressions.scala -- --check-regression --base "origin/${{ github.base_ref }}" --categories unit e2e

  verify:
    name: Stainless verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Cache the standalone Stainless distribution (bundled z3/cvc5) so we don't re-download the
      # ~80MB asset every run. Keyed on the version the script defaults to.
      - name: Cache Stainless tool
        uses: actions/cache@v4
        with:
          path: ~/.cache/scalasemantic/stainless
          key: stainless-0.9.9.3
      - name: Verify contracts
        # shells out to scripts/stainless-verify.sh; fails iff a VC is INVALID (the
        # nonlinear rangeSpan VC that the bundled solver can only mark `unknown` is tolerated).
        # Generous per-VC timeout here (prePush uses a tighter default for speed).
        run: ./mill analysis.stainlessVerify
        env:
          STAINLESS_TIMEOUT: '30'

  publish:
    name: Publish to Sonatype Central
    needs: [build, verify]
    # On a vX.Y.Z tag push (release), or a manual run (workflow_dispatch) which publishes a
    # -SNAPSHOT to dry-run credentials + signing without cutting a release.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PGP_SECRET: ${{ secrets.PGP_SECRET }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache coursier + Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill/download
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            mill-${{ runner.os }}-

      # Import the signing key into gpg up front (the proven aidclimbing flow). Two variants:
      # one for a passphrase-less key, one that imports then strips the passphrase.
      #
      # The key itself carries an expiration date (currently 2028-09-03). A key import always
      # "succeeds" even when expired, but every later gpg sign then fails with
      # "no default secret key: No secret key" — a confusing error that looks like a missing-key
      # problem, not an expired-key one. If this job starts failing that way again, check expiry
      # first: `gpg --list-secret-keys --keyid-format LONG` in a debug step, or ask whoever holds
      # the key in 1Password (item "GPG") to extend it with `gpg --quick-set-expire <fpr> 2y` and
      # update the PGP_SECRET secret.
      - name: Import signing key
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE == ''
        run: echo "$PGP_SECRET" | base64 -d -i - | gpg --import

      - name: Import signing key and strip passphrase
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE != ''
        run: |
          echo "$PGP_SECRET" | base64 -d -i - > /tmp/signing-key.gpg
          echo "$PGP_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 --import /tmp/signing-key.gpg
          (echo "$PGP_PASSPHRASE"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase $(gpg --list-secret-keys --with-colons 2> /dev/null | grep '^sec:' | cut --delimiter ':' --fields 5 | tail -n 1)

      - name: Publish (sign + upload via Mill)
        run: |
          ./mill mill.javalib.SonatypeCentralPublishModule/publishAll \
            --publishArtifacts __.publishArtifacts \
            --username "${{ secrets.SONATYPE_USERNAME }}" \
            --password "${{ secrets.SONATYPE_PASSWORD }}" \
            --useGpgCli true \
            --shouldRelease true

  release:
    name: GitHub Release (fat jar)
    needs: [build, verify]
    # Only on a vX.Y.Z tag push: build the standalone `java -jar` fat jar and attach it to a
    # GitHub Release so the auto-download launcher scripts can fetch the latest asset.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `publishVersion` stamps the jar with the tag version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build fat jar
        run: ./mill mcp.assembly
      - name: Collect asset
        # Mill's assembly output is always named out.jar (no sbt-assembly-style assemblyJarName
        # setting) — rename on copy so the release asset keeps its stable download filename.
        run: |
          mkdir -p release-assets
          cp out/mcp/assembly.dest/out.jar release-assets/scalasemantic-mcp.jar
      - name: Generate release notes (user-facing changes only)
        run: |
          # Body = filtered Conventional-Commit changelog for the range previous-tag..this-tag.
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          echo "Range: $range"
          scripts/changelog.sh "$range" | tee release-notes.md
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/scalasemantic-mcp.jar
          body_path: release-notes.md
